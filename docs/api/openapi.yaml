openapi: 3.1.0
info:
  title: 勤怠管理 API
  version: 0.1.0
  summary: テナント向けの勤怠管理 API（認証、打刻、勤怠、申請・承認、休暇、シフト、締め、設定）。
  description: |
    勤怠管理 SaaS のテナント向け API。アプリ（Blazor WebAssembly）と同じオリジンの CloudFront から、
    `/auth/*` と `/api/*` を API Gateway の HTTP API に振り分ける。

    - 規約（日時・時間の表し方、エラー、冪等キー、同時更新、ページング、ジョブ）は `README.md` にまとめる。
    - 運営者の API は別の仕様（`ops/openapi.yaml`）にする。
    - この仕様を正本にし、C# の型と Blazor 用のクライアントを生成する。
servers:
  - url: /
    description: アプリと同じオリジン（CloudFront の配下）。
security:
  - bearerAuth: [employee]
tags:
  - name: auth
    description: ログイン、トークンの更新、ログアウト、パスワード、招待、二要素認証、管理機能の再認証、共有端末の登録。
  - name: me
    description: 本人の打刻、勤怠、勤務予定、休暇、申請。
  - name: requests
    description: 申請の詳細と操作（申請者・承認者・管理者で共通）、承認待ちの一覧。
  - name: kiosk
    description: 共有端末での本人確認と打刻。
  - name: admin-attendance
    description: 管理者の勤怠の確認と補正、アラート、監査ログ、CSV の出力、ジョブ。
  - name: admin-shifts
    description: シフト表の作成・公開、公開後の勤務予定の変更。
  - name: admin-closing
    description: 月次の締めと再オープン。
  - name: admin-leave
    description: 有給の付与予定、手動の付与と調整、年5日の取得義務、時季指定、子の看護等休暇・介護休暇の日数。
  - name: admin-settings
    description: 従業員とアカウント、組織、就業ルール、勤務パターン、カレンダー、休暇種別、付与ルール、承認ルート、36協定、共有端末、テナントの設定。
x-tagGroups:
  - name: 従業員
    tags: [auth, me, requests]
  - name: 共有端末
    tags: [kiosk]
  - name: 管理
    tags: [admin-attendance, admin-shifts, admin-closing, admin-leave, admin-settings]
