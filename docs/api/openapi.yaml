components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: |
        自前で発行するアクセストークン（RS256、有効期間15分）。HTTP API の JWT オーソライザーで、署名・発行者・対象者・期限とスコープを確認する。
        操作の `security` に書いた値は、必要なスコープを表す。

        - `employee`: 従業員としてログインした。
        - `admin`: 管理機能の再認証が有効（`employee` と一緒に入る）。テナント管理者だけの操作は `x-required-roles` に書き、関数で確認する。
        - `kiosk`: 登録した共有端末。
    refreshCookie:
      type: apiKey
      in: cookie
      name: __Secure-tna_rt
      description: リフレッシュトークン（`Path=/auth`、HttpOnly）。CSRF 対策として `X-TNA-Request` ヘッダーも必須。
    deviceCookie:
      type: apiKey
      in: cookie
      name: __Secure-tna_device
      description: 共有端末の資格情報（`Path=/auth/v1/kiosk`、HttpOnly）。CSRF 対策として `X-TNA-Request` ヘッダーも必須。
