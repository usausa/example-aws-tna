        - dates
        - total
        - balanceBefore
        - balanceAfter
      properties:
        dates:
          type: array
          items:
            $ref: '#/components/schemas/ExpandedLeaveDate'
        total:
          $ref: '#/components/schemas/LeaveAmount'
