      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RequestCreate'
            examples:
              annualLeave:
                summary: 年次有給休暇（午前半休）
                value:
                  type: leave
                  leave:
                    leaveTypeId: 01J9ZK3M8Q6W2E4R5T7Y9V1H0P
                    from: '2026-10-20'
                    unit: amHalf
              punchCorrection:
                summary: 退勤の打刻漏れ
                value:
                  type: punchCorrection
                  punchCorrection:
                    workDate: '2026-10-06'
                    operations:
                      - op: add
                        type: clockOut
                        at: '2026-10-06T18:30:00+09:00'
