        takenDays:
          type: number
          multipleOf: 0.5
        remainingDays:
          type: number
          multipleOf: 0.5
        status:
          $ref: '#/components/schemas/LeaveObligationStatus'
    MyLeave:
      type: object
      required:
        - leaveTypes
