      properties:
        leaveBalances:
          type: array
          items:
            $ref: '#/components/schemas/LeaveBalance'
        obligation:
          oneOf:
            - $ref: '#/components/schemas/LeaveObligation'
            - type: 'null'
        correction:
          type:
            - object
            - 'null'
          properties:
            before:
              type: array
              items:
                $ref: '#/components/schemas/Punch'
            after:
              type: array
              items:
                $ref: '#/components/schemas/Punch'
            currentResults:
              $ref: '#/components/schemas/DailyResults'
    Request:
      description: 申請の詳細。
      allOf:
        - $ref: '#/components/schemas/RequestSummary'
        - type: object
          required:
            - round
            - steps
            - history
          properties:
            reason:
              type:
                - string
                - 'null'
            leave:
              oneOf:
                - $ref: '#/components/schemas/RequestLeaveDetail'
                - type: 'null'
            punchCorrection:
              oneOf:
                - $ref: '#/components/schemas/PunchCorrectionInput'
                - type: 'null'
