openapi: 3.1.0
info:
  title: 勤怠管理 API
  version: 0.1.0
  summary: テナント向けの勤怠管理 API（認証、打刻、勤怠、申請・承認、休暇、シフト、締め、設定）。
  description: |
    勤怠管理 SaaS のテナント向け API。アプリ（Blazor WebAssembly）と同じオリジンの CloudFront から、
    `/auth/*` と `/api/*` を API Gateway の HTTP API に振り分ける。

    - 規約（日時・時間の表し方、エラー、冪等キー、同時更新、ページング、ジョブ）は `README.md` にまとめる。
    - 運営者の API は別の仕様（`ops/openapi.yaml`）にする。
    - この仕様を正本にし、C# の型と Blazor 用のクライアントを生成する。
servers:
  - url: /
    description: アプリと同じオリジン（CloudFront の配下）。
security:
  - bearerAuth:
      - employee
tags:
  - name: auth
    description: ログイン、トークンの更新、ログアウト、パスワード、招待、二要素認証、管理機能の再認証、共有端末の登録。
  - name: me
    description: 本人の打刻、勤怠、勤務予定、休暇、申請。
  - name: requests
    description: 申請の詳細と操作（申請者・承認者・管理者で共通）、承認待ちの一覧。
  - name: kiosk
    description: 共有端末での本人確認と打刻。
  - name: admin-attendance
    description: 管理者の勤怠の確認と補正、アラート、監査ログ、CSV の出力、ジョブ。
  - name: admin-shifts
    description: シフト表の作成・公開、公開後の勤務予定の変更。
  - name: admin-closing
    description: 月次の締めと再オープン。
  - name: admin-leave
    description: 有給の付与予定、手動の付与と調整、年5日の取得義務、時季指定、子の看護等休暇・介護休暇の日数。
  - name: admin-settings
    description: 従業員とアカウント、組織、就業ルール、勤務パターン、カレンダー、休暇種別、付与ルール、承認ルート、36協定、共有端末、テナントの設定。
paths:
  /auth/v1/login:
    post:
      tags:
        - auth
      operationId: login
      x-module: Auth
      summary: ログインする
      description: |
        企業コード・ログインID・パスワードで認証する（UC-AU-02）。TOTP を登録していれば `mfaRequired` を返す。
        管理者が発行した初期パスワードか、TOTP がなく15文字に満たないパスワード（管理者が TOTP を解除した後）なら
        `passwordChangeRequired` を返す。
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: ログインの結果。`authenticated` の場合はリフレッシュトークンの Cookie を設定する。
          headers:
            Set-Cookie:
              $ref: '#/components/headers/SetCookieRefresh'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          description: 認証できない（INVALID_CREDENTIALS。アカウントの有無を区別しない）。ロック中も同じ。
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '429':
          $ref: '#/components/responses/TooManyRequests'
  /auth/v1/login/mfa:
    post:
      tags:
        - auth
      operationId: verifyMfa
      x-module: Auth
      summary: 二要素認証のコードを確認する
      description: ログインの途中で TOTP のコードを確認する（UC-AU-02）。
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MfaVerifyRequest'
      responses:
        '200':
          description: 認証が完了した。
          headers:
            Set-Cookie:
              $ref: '#/components/headers/SetCookieRefresh'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthenticatedResult'
        '401':
          description: コードの誤り、または途中の状態の期限切れ（MFA_INVALID、MFA_EXPIRED）。
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '429':
          $ref: '#/components/responses/TooManyRequests'
  /auth/v1/token:
    post:
      tags:
        - auth
      operationId: refreshToken
      x-module: Auth
      summary: アクセストークンを更新する
      description: |
        Cookie のリフレッシュトークンで新しいアクセストークンを発行し、リフレッシュトークンを新しいものに替える（UC-AU-09）。
        古いリフレッシュトークンが再び使われたら、その系列をすべて失効させる。管理機能の再認証が有効な間は `admin` スコープを含める。
      security:
        - refreshCookie: []
      parameters:
        - $ref: '#/components/parameters/CsrfHeader'
      responses:
        '200':
          description: 新しいアクセストークン。
          headers:
            Set-Cookie:
              $ref: '#/components/headers/SetCookieRefresh'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenResponse'
        '401':
          description: リフレッシュトークンが無効・期限切れ・再利用（SESSION_EXPIRED）。ログイン画面に戻す。
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '403':
          description: '`X-TNA-Request` ヘッダーがない（CSRF_HEADER_MISSING）。'
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
  /auth/v1/logout:
    post:
      tags:
        - auth
      operationId: logout
      x-module: Auth
      summary: ログアウトする
      description: その端末のセッション（`allDevices` なら本人のすべてのセッション）を失効させ、Cookie を消す（UC-AU-03）。
      security:
        - refreshCookie: []
      parameters:
        - $ref: '#/components/parameters/CsrfHeader'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LogoutRequest'
      responses:
        '204':
          description: ログアウトした。
          headers:
            Set-Cookie:
              $ref: '#/components/headers/SetCookieRefresh'
        '403':
          description: '`X-TNA-Request` ヘッダーがない（CSRF_HEADER_MISSING）。'
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
  /auth/v1/password/change:
    post:
      tags:
        - auth
      operationId: changePassword
      x-module: Auth
      summary: パスワードを変更する
      description: 現在のパスワードを確認して変更し、いまの端末以外のセッションを失効させ、本人にメールで知らせる（UC-AU-04）。
      security:
        - bearerAuth:
            - employee
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PasswordChangeRequest'
      responses:
        '204':
          description: 変更した。
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          description: 現在のパスワードの誤り（INVALID_CREDENTIALS）。
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '422':
          description: パスワードの条件を満たさない（PASSWORD_POLICY_VIOLATION）。`errors` に理由（短すぎる、漏えい・頻出のパスワード、ログインID と同じ）を入れる。
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
  /auth/v1/password/initial:
    post:
      tags:
        - auth
      operationId: changeInitialPassword
      x-module: Auth
      summary: 初期パスワードを変更する
      description: |
        管理者が発行した初期パスワードか、TOTP がなく15文字に満たないパスワードでログインした後に、新しいパスワードを設定する
        （UC-AU-02）。完了後はログインし直す。
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/InitialPasswordChangeRequest'
      responses:
        '204':
          description: 設定した。
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          description: 変更のための値が無効・期限切れ。
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '422':
          description: パスワードの条件を満たさない（PASSWORD_POLICY_VIOLATION）。`errors` に理由（短すぎる、漏えい・頻出のパスワード、ログインID と同じ）を入れる。
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
  /auth/v1/password/forgot:
    post:
      tags:
        - auth
      operationId: forgotPassword
      x-module: Auth
      summary: パスワードの再設定を依頼する
      description: アカウントの有無にかかわらず 202 を返す。メールアドレスが登録されていれば再設定のリンク（30分有効）を送る（UC-AU-05）。
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PasswordForgotRequest'
      responses:
        '202':
          description: 受け付けた。
        '429':
          $ref: '#/components/responses/TooManyRequests'
  /auth/v1/password/reset:
    post:
      tags:
        - auth
      operationId: resetPassword
      x-module: Auth
      summary: パスワードを再設定する
      description: 再設定のリンクの値で新しいパスワードを設定し、すべてのセッションを失効させる（UC-AU-05）。自動ではログインさせない。
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PasswordResetRequest'
      responses:
        '204':
          description: 再設定した。
        '400':
          $ref: '#/components/responses/BadRequest'
        '410':
          description: リンクの期限切れ・使用済み（TOKEN_EXPIRED）。
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '422':
          description: パスワードの条件を満たさない（PASSWORD_POLICY_VIOLATION）。`errors` に理由（短すぎる、漏えい・頻出のパスワード、ログインID と同じ）を入れる。
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
  /auth/v1/invitations/inspect:
    post:
      tags:
        - auth
      operationId: inspectInvitation
      x-module: Auth
      summary: 招待の内容を確認する
      description: 招待のリンクの値から、パスワード設定の画面に出すログインIDなどを返す（UC-AU-01）。
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/InvitationInspectRequest'
      responses:
        '200':
          description: 招待の内容。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InvitationInfo'
        '410':
          description: 期限切れ・使用済み（TOKEN_EXPIRED）。
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
  /auth/v1/invitations/accept:
    post:
      tags:
        - auth
      operationId: acceptInvitation
      x-module: Auth
      summary: 招待を受けてパスワードを設定する
      description: パスワードを設定してアカウントを有効にする（UC-AU-01）。完了後はログイン画面に移る。
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/InvitationAcceptRequest'
      responses:
        '204':
          description: 設定した。
        '400':
          $ref: '#/components/responses/BadRequest'
        '410':
          description: 期限切れ・使用済み（TOKEN_EXPIRED）。
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '422':
          description: パスワードの条件を満たさない（PASSWORD_POLICY_VIOLATION）。`errors` に理由（短すぎる、漏えい・頻出のパスワード、ログインID と同じ）を入れる。
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
  /auth/v1/step-up:
    post:
      tags:
        - auth
      operationId: stepUp
      x-module: Auth
      summary: 管理機能のために再認証する
      description: パスワードと TOTP を確認し、`admin` スコープを含むアクセストークンを返す（UC-AU-07）。有効なのは12時間、または最後の管理操作から1時間。
      security:
        - bearerAuth:
            - employee
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/StepUpRequest'
      responses:
        '200':
          description: 管理機能を使えるアクセストークン。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenResponse'
        '401':
          description: パスワードまたはコードの誤り。
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '403':
          description: 管理者ロールがない、または TOTP が未登録（MFA_ENROLLMENT_REQUIRED）。
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '429':
          $ref: '#/components/responses/TooManyRequests'
  /auth/v1/mfa/totp/setup:
    post:
      tags:
        - auth
      operationId: setupTotp
      x-module: Auth
      summary: TOTP の登録を始める
      description: 現在のパスワードを確かめて、秘密鍵と QR コード用の URI を返す（UC-AU-06）。10分以内に確認のコードを送る。パスワードの誤りはログインの失敗と合わせて数える。
      security:
        - bearerAuth:
            - employee
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TotpSetupRequest'
      responses:
        '200':
          description: 登録の情報。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TotpSetupResponse'
        '401':
          description: パスワードの誤り、またはロック中（INVALID_CREDENTIALS）。
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '409':
          $ref: '#/components/responses/Conflict'
  /auth/v1/mfa/totp/confirm:
    post:
      tags:
        - auth
      operationId: confirmTotp
      x-module: Auth
      summary: TOTP の登録を完了する
      description: 認証アプリのコードを確認して登録を完了し、本人にメールで知らせる（UC-AU-06）。
      security:
        - bearerAuth:
            - employee
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TotpConfirmRequest'
      responses:
        '204':
          description: 登録した。
        '401':
          description: コードの誤り（MFA_INVALID）。
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
  /auth/v1/kiosk/register:
    post:
      tags:
        - auth
      operationId: registerKiosk
      x-module: Auth
      summary: 共有端末を登録する
      description: 管理者が発行した登録コードで端末を登録し、端末の資格情報を Cookie に設定する（UC-KI-01）。
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/KioskRegisterRequest'
      responses:
        '200':
          description: 登録した。
          headers:
            Set-Cookie:
              $ref: '#/components/headers/SetCookieDevice'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/KioskRegistration'
        '410':
          description: 登録コードの期限切れ・使用済み（TOKEN_EXPIRED）。
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '429':
          $ref: '#/components/responses/TooManyRequests'
  /auth/v1/kiosk/token:
    post:
      tags:
        - auth
      operationId: issueKioskToken
      x-module: Auth
      summary: 共有端末のアクセストークンを発行する
      description: 端末の資格情報（Cookie）で、`kiosk` スコープのアクセストークン（15分）を発行する（UC-KI-02）。
      security:
        - deviceCookie: []
      parameters:
        - $ref: '#/components/parameters/CsrfHeader'
      responses:
        '200':
          description: 端末用のアクセストークン。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenResponse'
        '401':
          description: 端末の資格情報が無効（DEVICE_REVOKED）。
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '403':
          description: '`X-TNA-Request` ヘッダーがない（CSRF_HEADER_MISSING）。'
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
  /api/v1/me:
    get:
      tags:
        - me
      operationId: getMe
      x-module: Self
      summary: 本人の情報を取得する
      description: テナント、従業員、ロール、アカウント、機能の設定を返す。画面の起動時に呼び、すべての画面で使う。
      responses:
        '200':
          description: 本人の情報。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Me'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /api/v1/me/today:
    get:
      tags:
        - me
      operationId: getMyToday
      x-module: Self
      summary: 当日の状態を取得する
      description: 勤務日、状態、押せる打刻の種類、予定、打刻、警告を返す（UC-EM-01）。
      responses:
        '200':
          description: 当日の状態。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Today'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /api/v1/me/punches:
    post:
      tags:
        - me
      operationId: createMyPunch
      x-module: Punch
      summary: 打刻する
      description: |
        打刻を記録し、当日の状態を返す（UC-EM-02）。時刻はサーバーの受信時刻を使う。
        退勤済みの日の退勤は、退勤時刻の更新として受け付ける。日別勤怠の再計算は非同期。
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PunchCreateRequest'
            examples:
              clockIn:
                summary: 出勤
                value:
                  type: clockIn
                  clientTime: '2026-10-07T08:58:12+09:00'
      responses:
        '201':
          description: 記録した（同じ冪等キーの再送にも、最初の結果を 201 で返す）。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PunchCreateResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          description: 状態に合わない（PUNCH_SEQUENCE_INVALID）、締め済み（PERIOD_CLOSED）、受付期限切れ（PUNCH_WINDOW_EXPIRED）、在籍外（EMPLOYEE_INACTIVE）。
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
        '429':
          $ref: '#/components/responses/TooManyRequests'
  /api/v1/me/timesheets/{period}:
    get:
      tags:
        - me
      operationId: getMyTimesheet
      x-module: Self
      summary: 月の勤怠を取得する
      description: 給与の締め期間の日別勤怠と集計を返す（UC-EM-03）。フレックスの従業員には清算期間の状況も返す。
      parameters:
        - $ref: '#/components/parameters/Period'
      responses:
        '200':
          description: 期間の勤怠。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Timesheet'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
  /api/v1/me/daily-attendances/{workDate}:
    get:
      tags:
        - me
      operationId: getMyDailyAttendance
      x-module: Self
      summary: 日別の詳細を取得する
      description: 打刻（補正を含む）、区間、計算結果、エラーを返す（UC-EM-04）。
      parameters:
        - $ref: '#/components/parameters/WorkDate'
      responses:
        '200':
          description: 日別勤怠の詳細。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DailyAttendanceDetail'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
  /api/v1/me/schedules:
    get:
      tags:
        - me
      operationId: listMySchedules
      x-module: Self
      summary: 自分のシフトを取得する
      description: 公開済みの勤務予定を返す（UC-EM-05）。期間は最大62日。
      parameters:
        - $ref: '#/components/parameters/FromDate'
        - $ref: '#/components/parameters/ToDate'
      responses:
        '200':
          description: 勤務予定。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WorkScheduleList'
        '400':
