  /api/v1/admin/period-closes/{period}/close:
    post:
      tags:
        - admin-closing
      operationId: closePeriod
      x-module: AdminOps
      summary: 締める
      description: |
        締める前のチェックでエラーと申請が0件なら、範囲の勤怠をロックし、期間の集計を確定する。
        フレックスの過不足と1か月単位の変形の時間外もここで確定する。処理は非同期のジョブで行う（UC-AD-07）。
        締められるのは、期間の末日の打刻の受付期限を過ぎてから。範囲の従業員は、期間の中に在籍した人で、
        部署は期間の末日（それより前に退職した人は退職日）の所属で決める。全社の締めは、まだ締めていない人だけを締める。
      security:
        - bearerAuth:
            - admin
      parameters:
        - $ref: '#/components/parameters/Period'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PeriodCloseRequest'
      responses:
        '202':
          description: 受け付けた。
          headers:
            Location:
              $ref: '#/components/headers/Location'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Job'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          description: 締めを止めるエラーや申請が残っている（CLOSE_PRECHECK_FAILED）、締め済み（PERIOD_ALREADY_CLOSED）、受付期限の前（CLOSE_TOO_EARLY）。
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
