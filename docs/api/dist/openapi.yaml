          $ref: '#/components/schemas/Ulid'
        grantDate:
          type: string
          format: date
        lastUsableDate:
          type: string
          format: date
        granted:
          $ref: '#/components/schemas/LeaveAmount'
        remaining:
          $ref: '#/components/schemas/LeaveAmount'
        reason:
          type: string
          enum:
            - auto
            - manual
            - carryOver
            - adjustment
