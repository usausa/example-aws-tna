          type: string
          format: date
        amount:
          $ref: '#/components/schemas/LeaveAmount'
    LeaveBalance:
      type: object
      description: 休暇種別ごとの残り。
      required:
        - leaveTypeId
        - leaveTypeName
        - category
        - available
        - pending
        - lots
      properties:
        leaveTypeId:
          $ref: '#/components/schemas/Ulid'
        leaveTypeName:
          type: string
        category:
          $ref: '#/components/schemas/LeaveCategory'
        available:
          $ref: '#/components/schemas/LeaveAmount'
        pending:
          $ref: '#/components/schemas/LeaveAmount'
          description: 承認待ちの申請で使う予定の量。
        lots:
          type: array
          items:
            $ref: '#/components/schemas/LeaveLot'
        nextExpiry:
          oneOf:
            - $ref: '#/components/schemas/LeaveExpiry'
