components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: |
        自前で発行するアクセストークン（RS256、有効期間15分）。HTTP API の JWT オーソライザーで、署名・発行者・対象者・期限とスコープを確認する。
        操作の `security` に書いた値は、必要なスコープを表す。

        - `employee`: 従業員としてログインした。
        - `admin`: 管理機能の再認証が有効（`employee` と一緒に入る）。テナント管理者だけの操作は `x-required-roles` に書き、関数で確認する。
        - `kiosk`: 登録した共有端末。
    refreshCookie:
      type: apiKey
      in: cookie
      name: __Secure-tna_rt
      description: リフレッシュトークン（`Path=/auth`、HttpOnly）。CSRF 対策として `X-TNA-Request` ヘッダーも必須。
    deviceCookie:
      type: apiKey
      in: cookie
      name: __Secure-tna_device
      description: 共有端末の資格情報（`Path=/auth/v1/kiosk`、HttpOnly）。CSRF 対策として `X-TNA-Request` ヘッダーも必須。
  schemas:
    LoginRequest:
      type: object
      required:
        - tenantCode
        - loginId
        - password
      properties:
        tenantCode:
          type: string
          pattern: ^[A-Za-z0-9]{3,20}$
        loginId:
          type: string
          description: メールアドレス、またはメールのない従業員は社員番号。
          maxLength: 254
        password:
          type: string
          maxLength: 128
          writeOnly: true
    LoginResponse:
      type: object
      description: ログインの結果。`status` で分ける。
      required:
        - status
      properties:
        status:
          type: string
          enum:
            - authenticated
            - mfaRequired
            - passwordChangeRequired
      discriminator:
        propertyName: status
        mapping:
          authenticated: '#/components/schemas/AuthenticatedResult'
          mfaRequired: '#/components/schemas/MfaRequiredResult'
          passwordChangeRequired: '#/components/schemas/PasswordChangeRequiredResult'
    AuthenticatedResult:
      description: 認証が完了した（`status` は `authenticated`）。リフレッシュトークンは Set-Cookie で返す。
      allOf:
        - $ref: '#/components/schemas/LoginResponse'
        - type: object
          required:
            - accessToken
            - tokenType
            - expiresIn
          properties:
            accessToken:
              type: string
              description: JWT（RS256）。画面のメモリにだけ置く。
            tokenType:
              type: string
              const: Bearer
            expiresIn:
              type: integer
              description: アクセストークンの有効期間（秒）。
              examples:
                - 900
            scope:
              type: string
              description: 空白区切りのスコープ。管理機能の再認証が有効な間は `admin` を含む。
              examples:
                - employee
    MfaRequiredResult:
      description: パスワードは正しく、TOTP の確認が必要（`status` は `mfaRequired`）。
      allOf:
        - $ref: '#/components/schemas/LoginResponse'
        - type: object
          required:
            - mfaToken
            - expiresIn
          properties:
            mfaToken:
              type: string
              description: 二要素認証の途中の状態を表す値（5分有効）。
            expiresIn:
              type: integer
    PasswordChangeRequiredResult:
      description: |
        管理者が発行した初期パスワードか、TOTP がなく15文字に満たないパスワード（管理者が TOTP を解除した後）でログインした。
        パスワードの変更が必要（`status` は `passwordChangeRequired`）。
      allOf:
        - $ref: '#/components/schemas/LoginResponse'
        - type: object
          required:
            - changeToken
            - expiresIn
          properties:
            changeToken:
              type: string
            expiresIn:
              type: integer
    NullableUlid:
      type:
        - string
        - 'null'
      description: ULID（26文字）。値がなければ null。
      pattern: ^[0-9A-HJKMNP-TV-Z]{26}$
    ValidationIssue:
      type: object
      description: 検証の結果（エラーまたは警告）。入力の誤りでは `field` に項目の位置を入れる。
      required:
        - severity
        - code
        - message
      properties:
        severity:
          type: string
          enum:
            - error
            - warning
        code:
          type: string
        message:
          type: string
        employeeId:
          $ref: '#/components/schemas/NullableUlid'
        workDate:
          type:
            - string
            - 'null'
          format: date
          description: 対象の勤務日。なければ null。
        field:
          type:
            - string
            - 'null'
          description: 項目の位置（本文は JSON Pointer。例 `/leave/from`。ヘッダーとクエリは名前。例 `Idempotency-Key`、`nextToken`）。なければ null。
    Problem:
      type: object
      description: エラー（RFC 9457 Problem Details にアプリのコードを加えたもの）。
      required:
        - type
        - title
        - status
        - instance
        - code
      properties:
        type:
          type: string
          format: uri-reference
          description: エラーの種類を表す URI。`/problems/` に、コードを小文字のハイフン区切りにしたものを付ける（例 `/problems/period-closed`）。
        title:
          type: string
          description: 利用者向けの短い文言（日本語）。
        status:
          type: integer
        detail:
          type:
            - string
            - 'null'
          description: 補足の説明。なければ null。
        instance:
          type: string
          description: 調査用の要求の ID（API Gateway の要求の ID）。
        code:
          type: string
          description: アプリのエラーコード（API の README のコード一覧を参照）。
          examples:
            - PUNCH_SEQUENCE_INVALID
        errors:
          type:
            - array
            - 'null'
          description: 個々の誤り（入力の誤り、シフト表の検証のエラーなど）。なければ null。
          items:
            $ref: '#/components/schemas/ValidationIssue'
    MfaVerifyRequest:
      type: object
      required:
        - mfaToken
        - code
      properties:
        mfaToken:
          type: string
        code:
          type: string
          pattern: ^[0-9]{6}$
    TokenResponse:
      type: object
      required:
        - accessToken
        - tokenType
        - expiresIn
      properties:
        accessToken:
          type: string
        tokenType:
          type: string
          const: Bearer
        expiresIn:
          type: integer
        scope:
          type: string
    LogoutRequest:
      type: object
      properties:
        allDevices:
          type: boolean
          default: false
          description: すべての端末のセッションを失効させるか。
    PasswordChangeRequest:
      type: object
      required:
        - currentPassword
        - newPassword
      properties:
        currentPassword:
          type: string
          writeOnly: true
        newPassword:
          type: string
          minLength: 8
          maxLength: 128
          writeOnly: true
          description: 長さの条件は TOTP の登録の有無で変わる（認証のユースケース §2.2）。
    InitialPasswordChangeRequest:
      type: object
      required:
        - changeToken
        - newPassword
      properties:
        changeToken:
          type: string
        newPassword:
          type: string
          writeOnly: true
    PasswordForgotRequest:
      type: object
      required:
        - tenantCode
        - loginId
      properties:
        tenantCode:
          type: string
        loginId:
          type: string
    PasswordResetRequest:
      type: object
      required:
        - token
        - newPassword
      properties:
        token:
          type: string
          description: 再設定のリンクに含まれる値（30分有効、1回限り）。
        newPassword:
          type: string
          writeOnly: true
    InvitationInspectRequest:
      type: object
      required:
        - token
      properties:
        token:
          type: string
          description: 招待のリンクに含まれる値（72時間有効）。リンクは URL のフラグメントに値を入れ、サーバーのログに残らないようにする。
    InvitationInfo:
      type: object
      required:
        - tenantCode
        - tenantName
        - loginId
        - expiresAt
      properties:
        tenantCode:
          type: string
        tenantName:
          type: string
        loginId:
          type: string
        expiresAt:
          type: string
          format: date-time
    InvitationAcceptRequest:
      type: object
      required:
        - token
        - newPassword
      properties:
        token:
          type: string
        newPassword:
          type: string
          writeOnly: true
    StepUpRequest:
      type: object
      required:
        - password
        - code
      properties:
        password:
          type: string
          writeOnly: true
        code:
          type: string
          pattern: ^[0-9]{6}$
    TotpSetupRequest:
      type: object
      required:
        - password
      properties:
        password:
          type: string
          writeOnly: true
          description: 現在のパスワード。
    TotpSetupResponse:
      type: object
      required:
        - secret
        - otpauthUri
        - expiresAt
      properties:
        secret:
          type: string
          description: Base32 の秘密鍵（画面に一度だけ表示する）。
        otpauthUri:
          type: string
          description: QR コードにする `otpauth://totp/...` の URI。
        expiresAt:
          type: string
          format: date-time
          description: この時刻までに確認のコードを送らないと、登録の手続きは無効になる。
    TotpConfirmRequest:
      type: object
      required:
        - code
      properties:
        code:
          type: string
          pattern: ^[0-9]{6}$
    KioskRegisterRequest:
      type: object
      required:
        - registrationCode
      properties:
        registrationCode:
          type: string
          description: 管理者が発行した登録コード（10分有効、1回限り）。
          pattern: ^[A-Z0-9]{8}$
    Ulid:
      type: string
      description: ULID（26文字）。
      pattern: ^[0-9A-HJKMNP-TV-Z]{26}$
      examples:
        - 01J9ZK3M8Q6W2E4R5T7Y9V1H0P
    KioskRegistration:
      type: object
      required:
        - deviceId
        - deviceName
        - tenantName
      properties:
        deviceId:
          $ref: '#/components/schemas/Ulid'
        deviceName:
          type: string
        tenantName:
          type: string
    MeTenant:
      type: object
      description: 本人のテナント。
      required:
        - tenantCode
        - name
        - timeZone
      properties:
        tenantCode:
          type: string
        name:
          type: string
        timeZone:
          type: string
          examples:
            - Asia/Tokyo
    WorkSystem:
      type: string
      enum:
        - fixed
        - shift
        - flex
        - monthlyVariable
    MeEmployee:
      type: object
      description: 本人の従業員の情報。
      required:
        - employeeId
        - employeeCode
        - name
        - departmentName
        - workSystem
      properties:
        employeeId:
          $ref: '#/components/schemas/Ulid'
        employeeCode:
          type: string
        name:
          type: string
        departmentName:
          type: string
        workSystem:
          $ref: '#/components/schemas/WorkSystem'
    AdminScope:
      type: object
      description: 勤怠管理者の管理範囲。
      required:
        - departmentId
        - includeDescendants
      properties:
        departmentId:
          $ref: '#/components/schemas/Ulid'
        includeDescendants:
          type: boolean
    Roles:
      type: object
      required:
        - tenantAdmin
        - attendanceAdmin
      properties:
        tenantAdmin:
          type: boolean
        attendanceAdmin:
          type:
            - object
            - 'null'
          description: 勤怠管理者でなければ null。
          required:
            - scopes
          properties:
            scopes:
              type: array
              minItems: 1
              items:
                $ref: '#/components/schemas/AdminScope'
    AccountStatus:
      type: string
      description: '`none` はアカウントがない（共有端末での打刻だけの従業員）。'
      enum:
        - none
        - invited
        - active
        - locked
        - disabled
    AccountSummary:
      type: object
      required:
        - status
        - mfaEnabled
        - pinSet
      properties:
        status:
          $ref: '#/components/schemas/AccountStatus'
        loginId:
          type:
            - string
            - 'null'
        mfaEnabled:
          type: boolean
        pinSet:
          type: boolean
        pinInitial:
          type: boolean
          description: 管理者が発行した初期 PIN のまま。
        lastLoginAt:
          type:
            - string
            - 'null'
          format: date-time
    LocationTrackingSetting:
      type: object
      description: 打刻時の位置情報の記録。
      required:
        - enabled
      properties:
        enabled:
          type: boolean
        purposeText:
          type:
            - string
            - 'null'
          maxLength: 500
          description: 従業員に示す利用目的の文。
    MeFeatures:
      type: object
      description: 画面の表示を変えるテナントの設定。
      required:
        - locationTracking
      properties:
        locationTracking:
          $ref: '#/components/schemas/LocationTrackingSetting'
    Me:
      type: object
      description: ログインしている本人の情報（GET /api/v1/me）。
      required:
        - tenant
        - employee
        - roles
        - account
        - features
      properties:
        tenant:
          $ref: '#/components/schemas/MeTenant'
        employee:
          $ref: '#/components/schemas/MeEmployee'
        roles:
          $ref: '#/components/schemas/Roles'
        isApprover:
          type: boolean
          description: 承認待ちの申請を持つことがある（所属長、承認ルートの指定など）。
        account:
          $ref: '#/components/schemas/AccountSummary'
        features:
          $ref: '#/components/schemas/MeFeatures'
    TodayStatus:
      type: string
      description: 当日の打刻の状態。
      enum:
        - notStarted
        - working
        - onBreak
        - finished
    PunchType:
      type: string
      enum:
        - clockIn
        - clockOut
        - breakStart
        - breakEnd
    DayType:
      type: string
      description: 日の種類。
      enum:
        - workday
        - nonStatutoryHoliday
        - statutoryHoliday
    NullableMinuteOfDay:
      type:
        - integer
        - 'null'
      minimum: 0
      maximum: 2879
      description: MinuteOfDay と同じ。値がなければ null。
    MinuteOfDay:
      type: integer
      minimum: 0
      maximum: 2879
      description: 勤務日の 0:00 からの経過分。翌日にかかる時刻は 1440 以上（例 翌2:00 は 1560）。
    Break:
      type: object
      required:
        - startMinute
        - endMinute
      properties:
        startMinute:
          $ref: '#/components/schemas/MinuteOfDay'
        endMinute:
          $ref: '#/components/schemas/MinuteOfDay'
    Minutes:
      type: integer
      minimum: 0
      description: 時間の量（分）。
    ScheduleSummary:
      type: object
      description: 勤務予定の要約。
      required:
        - dayType
      properties:
        dayType:
          $ref: '#/components/schemas/DayType'
        workPatternId:
          $ref: '#/components/schemas/NullableUlid'
        workPatternName:
          type:
            - string
            - 'null'
        startMinute:
          $ref: '#/components/schemas/NullableMinuteOfDay'
        endMinute:
          $ref: '#/components/schemas/NullableMinuteOfDay'
        breaks:
          type: array
          items:
            $ref: '#/components/schemas/Break'
        scheduledMinutes:
          $ref: '#/components/schemas/Minutes'
    PunchSource:
      type: string
      enum:
        - web
        - mobile
        - kiosk
        - api
    Location:
      type: object
      required:
        - latitude
        - longitude
      properties:
        latitude:
          type: number
          minimum: -90
          maximum: 90
        longitude:
          type: number
          minimum: -180
          maximum: 180
        accuracyMeters:
          type: number
          minimum: 0
    Punch:
      type: object
      required:
        - punchId
        - type
        - occurredAt
        - effectiveAt
        - workDate
        - source
        - status
      properties:
        punchId:
          $ref: '#/components/schemas/Ulid'
        type:
          $ref: '#/components/schemas/PunchType'
        occurredAt:
          type: string
          format: date-time
          description: サーバーの受信時刻（秒まで）。
        effectiveAt:
          type: string
          format: date-time
          description: 計算に使う時刻（従業員に不利にならない方向で分に丸めた値）。
        clientTime:
          type:
            - string
            - 'null'
          format: date-time
        clientTimeSkewed:
          type: boolean
          description: 端末時刻とサーバー時刻の差が許容値を超えた。
        workDate:
          type: string
          format: date
        source:
          $ref: '#/components/schemas/PunchSource'
        deviceId:
          $ref: '#/components/schemas/NullableUlid'
        location:
          oneOf:
            - $ref: '#/components/schemas/Location'
            - type: 'null'
        note:
          type:
            - string
            - 'null'
        status:
          type: string
          description: '`voided` は補正で無効にした打刻、`added` は補正で追加した打刻。'
          enum:
            - active
            - voided
            - added
    LeaveUnit:
      type: string
      description: 休暇の単位。
      enum:
        - fullDay
        - amHalf
        - pmHalf
        - hourly
    DayLeave:
      type: object
      description: その日の休暇。
      required:
        - leaveTypeId
        - leaveTypeName
        - unit
        - minutes
      properties:
        leaveTypeId:
          $ref: '#/components/schemas/Ulid'
        leaveTypeName:
          type: string
        unit:
          $ref: '#/components/schemas/LeaveUnit'
        startMinute:
          $ref: '#/components/schemas/MinuteOfDay'
        endMinute:
          $ref: '#/components/schemas/MinuteOfDay'
        minutes:
          $ref: '#/components/schemas/Minutes'
        requestId:
          $ref: '#/components/schemas/Ulid'
    Warning:
      type: object
      description: ホームに出す警告。
      required:
        - code
        - message
      properties:
        code:
          type: string
          examples:
            - missingPunch
        message:
          type: string
        workDate:
          type: string
          format: date
        requestId:
          $ref: '#/components/schemas/Ulid'
    Today:
      type: object
      description: 当日の状態（ホームの表示に使う）。
      required:
        - serverTime
        - workDate
        - status
        - availableActions
        - punches
        - warnings
      properties:
        serverTime:
          type: string
          format: date-time
          description: サーバーの現在時刻。画面の時計の補正に使う。
        workDate:
          type: string
          format: date
        status:
          $ref: '#/components/schemas/TodayStatus'
        availableActions:
          type: array
          description: いま押せる打刻の種類。退勤済みの日は `clockOut`（押し直し）を含む。
          items:
            $ref: '#/components/schemas/PunchType'
        schedule:
          oneOf:
            - $ref: '#/components/schemas/ScheduleSummary'
            - type: 'null'
        punches:
          type: array
          items:
            $ref: '#/components/schemas/Punch'
        leaves:
          type: array
          items:
            $ref: '#/components/schemas/DayLeave'
        warnings:
          type: array
          items:
            $ref: '#/components/schemas/Warning'
        pendingApprovalCount:
          type: integer
          minimum: 0
          description: 自分が承認すべき申請の件数（承認者でなければ 0）。
    PunchCreateRequest:
      type: object
      required:
        - type
      properties:
        type:
          $ref: '#/components/schemas/PunchType'
        clientTime:
          type: string
          format: date-time
          description: 端末の時刻（参考値）。計算にはサーバーの受信時刻を使う。
        location:
          $ref: '#/components/schemas/Location'
        note:
          type: string
          maxLength: 200
    PunchCreateResponse:
      type: object
      required:
        - punch
        - today
      properties:
        punch:
          $ref: '#/components/schemas/Punch'
        today:
          $ref: '#/components/schemas/Today'
    PeriodId:
      type: string
      description: 給与の締め期間の ID。期間の末日が属する年月（`YYYY-MM`）。
      pattern: ^[0-9]{4}-(0[1-9]|1[0-2])$
      examples:
        - 2026-10
    EmployeeRef:
      type: object
      required:
        - employeeId
        - employeeCode
        - name
      properties:
        employeeId:
          $ref: '#/components/schemas/Ulid'
        employeeCode:
          type: string
        name:
          type: string
          description: 表示用の氏名。
    Period:
      type: object
      required:
        - id
        - start
        - end
      properties:
        id:
          $ref: '#/components/schemas/PeriodId'
        start:
          type: string
          format: date
        end:
          type: string
          format: date
    DailyResults:
      type: object
      description: 日別勤怠の計算結果（分）。
      required:
        - actualWorkMinutes
        - scheduledWorkedMinutes
        - outsideScheduleMinutes
        - overtimeWithinStatutoryMinutes
        - statutoryOvertimeMinutes
        - lateNightMinutes
        - statutoryHolidayWorkMinutes
        - lateArrivalMinutes
        - earlyLeaveMinutes
        - breakMinutes
        - absence
      properties:
        actualWorkMinutes:
          $ref: '#/components/schemas/Minutes'
        scheduledWorkedMinutes:
          $ref: '#/components/schemas/Minutes'
        outsideScheduleMinutes:
          $ref: '#/components/schemas/Minutes'
        overtimeWithinStatutoryMinutes:
          $ref: '#/components/schemas/Minutes'
        statutoryOvertimeMinutes:
          $ref: '#/components/schemas/Minutes'
        statutoryOvertimeOver60Minutes:
          $ref: '#/components/schemas/Minutes'
        lateNightMinutes:
          $ref: '#/components/schemas/Minutes'
        lateNightOvertimeMinutes:
          $ref: '#/components/schemas/Minutes'
        statutoryHolidayWorkMinutes:
          $ref: '#/components/schemas/Minutes'
        lateNightHolidayMinutes:
          $ref: '#/components/schemas/Minutes'
        nonStatutoryHolidayWorkMinutes:
          $ref: '#/components/schemas/Minutes'
        lateArrivalMinutes:
          $ref: '#/components/schemas/Minutes'
        earlyLeaveMinutes:
          $ref: '#/components/schemas/Minutes'
        breakMinutes:
          $ref: '#/components/schemas/Minutes'
        absence:
          type: boolean
        coreTimeMissingMinutes:
          $ref: '#/components/schemas/Minutes'
        deemedMinutes:
          $ref: '#/components/schemas/Minutes'
    AttendanceError:
      type: object
      required:
        - code
        - severity
      properties:
        code:
          type: string
          enum:
            - missingClockOut
            - missingBreakEnd
            - punchSequence
            - insufficientBreak
            - clientTimeSkew
            - legalHolidayNotSecured
            - absenceSuspected
        severity:
          type: string
          enum:
            - error
            - warning
    DailyAttendance:
      type: object
      description: 日別勤怠（一覧用）。
      required:
        - workDate
        - dayType
        - results
        - leaves
        - errors
        - provisional
        - locked
      properties:
        workDate:
          type: string
          format: date
        dayType:
          $ref: '#/components/schemas/DayType'
        schedule:
          oneOf:
            - $ref: '#/components/schemas/ScheduleSummary'
            - type: 'null'
        firstClockIn:
          type:
            - string
            - 'null'
          format: date-time
        lastClockOut:
          type:
            - string
            - 'null'
          format: date-time
        results:
          $ref: '#/components/schemas/DailyResults'
        leaves:
          type: array
          items:
            $ref: '#/components/schemas/DayLeave'
        errors:
          type: array
          items:
            $ref: '#/components/schemas/AttendanceError'
        provisional:
          type: boolean
          description: 週や期間の時間外がまだ確定していない（見込みの値を含む）。
        locked:
          type: boolean
          description: 締め済み。
        adjusted:
          type: boolean
          description: 補正がある。
    LeaveAmount:
      type: object
      description: 休暇の量。日数（0.5日単位）と時間（分）の組。
      required:
        - days
        - minutes
      properties:
        days:
          type: number
          minimum: 0
          multipleOf: 0.5
        minutes:
          type: integer
          minimum: 0
    PeriodTotals:
      type: object
      description: 期間の集計（分・日数）。
      required:
        - workDays
        - absenceDays
        - results
      properties:
        workDays:
          type: integer
        absenceDays:
          type: integer
        statutoryHolidayWorkDays:
          type: integer
        nonStatutoryHolidayWorkDays:
          type: integer
        lateArrivalCount:
          type: integer
        earlyLeaveCount:
          type: integer
        results:
          $ref: '#/components/schemas/DailyResults'
        leaves:
          type: array
          description: 休暇の種別ごとの取得。
          items:
            type: object
            required:
              - leaveTypeId
              - leaveTypeName
              - amount
            properties:
              leaveTypeId:
                $ref: '#/components/schemas/Ulid'
              leaveTypeName:
                type: string
              amount:
                $ref: '#/components/schemas/LeaveAmount'
        rounded:
          type:
            - object
            - 'null'
          description: 月合計の端数処理（30分基準）を有効にしている場合の処理後の値。
          properties:
            statutoryOvertimeMinutes:
              $ref: '#/components/schemas/Minutes'
            statutoryOvertimeOver60Minutes:
              $ref: '#/components/schemas/Minutes'
            statutoryHolidayWorkMinutes:
              $ref: '#/components/schemas/Minutes'
            lateNightMinutes:
              $ref: '#/components/schemas/Minutes'
    SignedMinutes:
      type: integer
      description: 正負のある時間の量（分）。
    FlexSettlement:
      type: object
      description: フレックスの清算期間の状況。
      required:
        - contractualTotalMinutes
        - statutoryLimitMinutes
        - actualMinutes
        - leaveDeemedMinutes
        - balanceMinutes
      properties:
        contractualTotalMinutes:
          $ref: '#/components/schemas/Minutes'
        statutoryLimitMinutes:
          $ref: '#/components/schemas/Minutes'
        actualMinutes:
          $ref: '#/components/schemas/Minutes'
        leaveDeemedMinutes:
          $ref: '#/components/schemas/Minutes'
        balanceMinutes:
          $ref: '#/components/schemas/SignedMinutes'
        carriedInMinutes:
          $ref: '#/components/schemas/Minutes'
        carriedOutMinutes:
          $ref: '#/components/schemas/Minutes'
        shortageHandling:
          type: string
          enum:
            - carryOver
            - deduct
        final:
          type: boolean
          description: 清算期間が締め済みで確定している。
    Timesheet:
      type: object
      description: 期間の勤怠（日別と集計）。
      required:
        - employee
        - period
        - closed
        - closeVersion
        - days
        - totals
      properties:
        employee:
          $ref: '#/components/schemas/EmployeeRef'
        period:
          $ref: '#/components/schemas/Period'
        closed:
          type: boolean
        closeVersion:
          type:
            - integer
            - 'null'
          description: 締め済みなら、最新の締めの版。締めていなければ null。
        days:
          type: array
          items:
            $ref: '#/components/schemas/DailyAttendance'
        totals:
          $ref: '#/components/schemas/PeriodTotals'
        flex:
          oneOf:
            - $ref: '#/components/schemas/FlexSettlement'
            - type: 'null'
    AdjustmentOperation:
      type: object
      description: 補正の操作。打刻の追加（`add`）か、既存の打刻の無効化（`void`）。時刻の変更は「無効化＋追加」で表す。
      required:
        - op
      properties:
        op:
          type: string
          enum:
            - add
            - void
      discriminator:
        propertyName: op
        mapping:
          add: '#/components/schemas/AdjustmentAddOperation'
          void: '#/components/schemas/AdjustmentVoidOperation'
    AdjustmentAddOperation:
      description: 打刻の追加（`op` は `add`）。
      allOf:
        - $ref: '#/components/schemas/AdjustmentOperation'
        - type: object
          required:
            - type
            - at
          properties:
            type:
              $ref: '#/components/schemas/PunchType'
            at:
              type: string
              format: date-time
    AdjustmentVoidOperation:
      description: 既存の打刻の無効化（`op` は `void`）。
      allOf:
        - $ref: '#/components/schemas/AdjustmentOperation'
        - type: object
          required:
            - punchId
          properties:
            punchId:
              $ref: '#/components/schemas/Ulid'
    Adjustment:
      type: object
      description: 打刻の補正。
      required:
        - adjustmentId
        - operations
        - reason
        - createdAt
      properties:
        adjustmentId:
          $ref: '#/components/schemas/Ulid'
        operations:
          type: array
          items:
            $ref: '#/components/schemas/AdjustmentOperation'
        reason:
          type: string
        requestId:
          $ref: '#/components/schemas/NullableUlid'
        adjustedBy:
          oneOf:
            - $ref: '#/components/schemas/EmployeeRef'
            - type: 'null'
        createdAt:
          type: string
          format: date-time
    Segment:
      type: object
      description: 日別勤怠の区間。
      required:
        - kind
        - start
        - end
        - origin
      properties:
        kind:
          type: string
          enum:
            - work
            - break
        start:
          type: string
          format: date-time
        end:
          type: string
          format: date-time
        origin:
          type: string
          enum:
            - punch
            - rule
            - adjustment
    ETagValue:
      type: string
      readOnly: true
      description: リソースの版。単一の取得の ETag ヘッダーと同じ値で、一覧の要素から更新するときは、この値を If-Match に送る。
      examples:
        - '"7"'
    DailyAttendanceDetail:
      description: 日別勤怠の詳細。
      allOf:
        - $ref: '#/components/schemas/DailyAttendance'
