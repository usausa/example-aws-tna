            $ref: '#/components/schemas/RequestInclude'
      responses:
        '200':
          description: 申請の詳細。
          headers:
            ETag:
              $ref: '#/components/headers/ETag'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Request'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
