              type: integer
              description: 差戻し後の再申請の回数（最初は 1）。
            steps:
              type: array
              items:
                $ref: '#/components/schemas/ApprovalStep'
            history:
              type: array
              items:
                $ref: '#/components/schemas/ApprovalHistoryItem'
            allowedActions:
              type: array
              description: 呼び出した人がいまできる操作。
              items:
                $ref: '#/components/schemas/RequestAction'
            context:
              oneOf:
                - $ref: '#/components/schemas/RequestContext'
                - type: 'null'
            etag:
              $ref: '#/components/schemas/ETagValue'
