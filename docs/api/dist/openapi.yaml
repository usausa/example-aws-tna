  /api/v1/requests/{requestId}/actions:
    post:
      tags:
        - requests
      operationId: actOnRequest
      x-module: Self
      summary: 申請を操作する
      description: |
        申請者の取下げ（UC-WF-03）・再申請（UC-WF-04）・取消の申請（UC-WF-05）、承認者の承認・差戻し・却下（UC-WF-07）、
        取消の承認と却下（UC-WF-08）、管理者の取消（UC-WF-09。`admin` スコープが必要）を行う。
        最終の承認と取消の承認で、勤怠・休暇への反映（または戻し）を行う。
      parameters:
        - $ref: '#/components/parameters/RequestId'
        - $ref: '#/components/parameters/IfMatch'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RequestActionInput'
            examples:
              approve:
                summary: 承認
                value:
                  action: approve
              sendBack:
                summary: 差戻し
                value:
                  action: sendBack
                  comment: 時刻を確認してください
      responses:
        '200':
          description: 操作後の申請。
          headers:
            ETag:
              $ref: '#/components/headers/ETag'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Request'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          description: その操作ができない（自分の申請の承認、範囲外など。ACTION_NOT_ALLOWED）。
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: 状態に合わない（REQUEST_STATE_INVALID）、反映先の期間が締め済み（PERIOD_CLOSED）。
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '412':
          $ref: '#/components/responses/PreconditionFailed'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
        '428':
          $ref: '#/components/responses/PreconditionRequired'
