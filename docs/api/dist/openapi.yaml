          required:
            - punches
            - adjustments
            - segments
          properties:
            punches:
              type: array
              description: 元の打刻と、補正で追加した打刻（無効にしたものも含む）。
              items:
                $ref: '#/components/schemas/Punch'
            adjustments:
              type: array
              items:
                $ref: '#/components/schemas/Adjustment'
            segments:
              type: array
              items:
                $ref: '#/components/schemas/Segment'
            etag:
              $ref: '#/components/schemas/ETagValue'
    WorkSchedule:
      description: 従業員×勤務日の勤務予定（公開済みのもの）。
      allOf:
        - $ref: '#/components/schemas/ScheduleSummary'
        - type: object
          required:
            - employeeId
            - workDate
            - source
          properties:
            employeeId:
              $ref: '#/components/schemas/Ulid'
            workDate:
              type: string
              format: date
            source:
              type: string
              enum:
                - rule
                - shiftPlan
                - manual
            changedAfterPublish:
              type: boolean
              description: 公開後に変更された。
            lastChangedAt:
              type:
                - string
                - 'null'
              format: date-time
            etag:
              $ref: '#/components/schemas/ETagValue'
    WorkScheduleList:
      type: object
      description: 勤務予定の一覧（日付順）。
      required:
        - items
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/WorkSchedule'
    LeaveCategory:
      type: string
      enum:
        - annualPaid
        - special
        - childNursing
        - familyCare
    LeaveType:
      type: object
      required:
        - leaveTypeId
        - code
        - name
        - category
        - paid
        - units
        - balanceManaged
        - attendanceRateTreatment
        - requiresApproval
        - reasonRequired
        - status
        - builtIn
      properties:
        leaveTypeId:
          $ref: '#/components/schemas/Ulid'
          readOnly: true
        code:
          type: string
          maxLength: 20
        name:
          type: string
          maxLength: 50
        category:
          $ref: '#/components/schemas/LeaveCategory'
