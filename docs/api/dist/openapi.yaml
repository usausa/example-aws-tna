        unit:
          $ref: '#/components/schemas/LeaveUnit'
        startMinute:
          $ref: '#/components/schemas/MinuteOfDay'
          description: 時間単位のときの開始。
        endMinute:
          $ref: '#/components/schemas/MinuteOfDay'
          description: 時間単位のときの終了。
