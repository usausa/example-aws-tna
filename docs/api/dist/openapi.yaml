              maximum: 2
              description: 締め日の何か月後か（翌月払いなら 1）。
            day:
              type: integer
              minimum: 0
              maximum: 28
              description: 支払日。0 は末日。
        punchAcceptance:
          type: object
          required:
            - daysAfterWorkDate
            - untilMinute
          properties:
            daysAfterWorkDate:
              type: integer
              minimum: 0
              maximum: 7
              default: 1
            untilMinute:
              type: integer
              minimum: 0
              maximum: 1439
              default: 1439
        clientTimeSkewToleranceMinutes:
          type: integer
          minimum: 1
          default: 5
        locationTracking:
          $ref: '#/components/schemas/LocationTrackingSetting'
        missedPunchNotifyMinute:
          type: integer
          minimum: 0
          maximum: 1439
          default: 480
          description: 打刻漏れなどを知らせる時刻（0:00 からの分。既定 8:00）。
        csvDefaults:
          $ref: '#/components/schemas/CsvFormat'
        retentionExtensionYears:
          type: integer
          minimum: 0
          maximum: 10
          default: 0
        scheduleChangeReasons:
          type: array
          items:
            $ref: '#/components/schemas/ScheduleChangeReason'
        etag:
          $ref: '#/components/schemas/ETagValue'
  headers:
    SetCookieRefresh:
      description: |
        リフレッシュトークンの Cookie。`__Secure-tna_rt`、`Path=/auth`、`HttpOnly`、`Secure`、`SameSite=Strict`。
        ログアウトでは期限切れの値で上書きして消す。
      schema:
        type: string
    RetryAfter:
      description: 再送まで待つ秒数。
      schema:
        type: integer
        minimum: 1
    SetCookieDevice:
      description: |
        共有端末の資格情報の Cookie。`__Secure-tna_device`、`Path=/auth/v1/kiosk`、`HttpOnly`、`Secure`、`SameSite=Strict`、有効期間365日。
      schema:
        type: string
    ETag:
      description: リソースの版。更新するときに If-Match で送る。
      schema:
        type: string
    Location:
      description: 作成したリソース、またはジョブの URL。
      schema:
        type: string
  responses:
    BadRequest:
      description: 入力の誤り（VALIDATION_FAILED）。`errors` に項目ごとの誤りを入れる。
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    TooManyRequests:
      description: レート制限（RATE_LIMITED）。Retry-After の秒数だけ待って、同じ冪等キーで再送する。
      headers:
        Retry-After:
          $ref: '#/components/headers/RetryAfter'
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    Conflict:
      description: 状態の競合（PUNCH_SEQUENCE_INVALID、PERIOD_CLOSED、REQUEST_STATE_INVALID、マスタのコードの重複 CODE_DUPLICATED、冪等キーの処理中 IDEMPOTENCY_KEY_IN_PROGRESS など）。
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    Unauthorized:
      description: 認証されていない、またはアクセストークンの期限切れ（UNAUTHENTICATED）。画面はトークンを更新してから1回だけ再送する。
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    Forbidden:
      description: 権限がない（FORBIDDEN）。管理機能の再認証が必要（REAUTH_REQUIRED）、テナントの停止（TENANT_SUSPENDED）も 403 で返す。
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    UnprocessableEntity:
      description: 業務規則の違反（LEAVE_BALANCE_INSUFFICIENT、IDEMPOTENCY_KEY_REUSED など）。
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    NotFound:
      description: 対象が見つからない（NOT_FOUND）。権限の範囲外のものも 404 として返す。
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    PreconditionFailed:
      description: If-Match が一致しない（VERSION_CONFLICT）。最新の状態を取得し直す。
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    PreconditionRequired:
      description: If-Match がない（PRECONDITION_REQUIRED）。
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
  parameters:
    CsrfHeader:
      name: X-TNA-Request
      in: header
      required: true
      description: Cookie で認証する経路の CSRF 対策。値は常に `1`。
      schema:
        type: string
        const: '1'
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      description: |
        冪等キー。画面が操作ごとに作り（UUID または ULID）、再送でも同じ値を送る。
        同じキーの再送には最初の結果を返す。同じキーで内容が違う要求は 422（IDEMPOTENCY_KEY_REUSED）、最初の要求の処理中に届いた再送は 409（IDEMPOTENCY_KEY_IN_PROGRESS）。キーは24時間保持する。
      schema:
        type: string
        minLength: 16
        maxLength: 64
    Period:
      name: period
      in: path
      required: true
      description: 給与の締め期間の ID（期間の末日が属する年月）。
      schema:
        $ref: '#/components/schemas/PeriodId'
    WorkDate:
      name: workDate
      in: path
      required: true
      description: 勤務日。
      schema:
        type: string
        format: date
    FromDate:
      name: from
      in: query
      description: 期間の開始日（その日を含む）。
      schema:
        type: string
        format: date
    ToDate:
      name: to
      in: query
      description: 期間の終了日（その日を含む）。期間は最大62日。
      schema:
        type: string
        format: date
    Limit:
      name: limit
      in: query
      description: 1回に返す件数（既定 50、最大 100）。
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 50
    NextToken:
      name: nextToken
      in: query
      description: 前の応答の `nextToken`。続きを取得するときに指定する。有効期限は1時間で、期限を過ぎたものや、ほかの一覧・ほかの絞り込みの条件で得たものは 400（`VALIDATION_FAILED`）になる。そのときは最初のページから取り直す。
      schema:
        type: string
    RequestId:
      name: requestId
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/Ulid'
    IfMatch:
      name: If-Match
      in: header
      required: true
      description: 取得時の ETag。一致しなければ 412（VERSION_CONFLICT）、省略すると 428。
      schema:
        type: string
    DepartmentIdQuery:
      name: departmentId
      in: query
      description: 部署で絞り込む。
      schema:
        $ref: '#/components/schemas/Ulid'
    IncludeDescendants:
      name: includeDescendants
      in: query
      description: 配下の部署を含めるか（既定 true）。
      schema:
        type: boolean
        default: true
    EmployeeId:
      name: employeeId
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/Ulid'
    JobId:
      name: jobId
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/Ulid'
    DepartmentId:
      name: departmentId
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/Ulid'
x-tagGroups:
  - name: 従業員
    tags:
      - auth
      - me
      - requests
  - name: 共有端末
    tags:
      - kiosk
  - name: 管理
    tags:
      - admin-attendance
      - admin-shifts
      - admin-closing
      - admin-leave
      - admin-settings
