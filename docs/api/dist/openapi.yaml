      x-module: Self
      summary: 申請の詳細を取得する
      description: |
        申請者、現在・過去の段の承認者、範囲内の管理者が取得できる（それ以外は 404）。
        `include=context` を指定すると、承認者と管理者には承認の参考情報（休暇の残り、修正前後の打刻）を返す（UC-WF-03〜09、EM09、AP02）。
      parameters:
        - $ref: '#/components/parameters/RequestId'
