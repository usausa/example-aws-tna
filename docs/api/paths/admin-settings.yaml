            $ref: ../components/schemas/organization.yaml#/RolesUpdate
    responses:
      "200":
        description: 設定したロール。
        content:
          application/json:
            schema:
              $ref: ../components/schemas/organization.yaml#/Roles
      "403":
        $ref: ../components/responses.yaml#/Forbidden
      "409":
        description: テナント管理者がいなくなる（LAST_TENANT_ADMIN）。
        content:
          application/problem+json:
            schema:
              $ref: ../components/schemas/common.yaml#/Problem
      "412":
        $ref: ../components/responses.yaml#/PreconditionFailed
accountInvitation:
