    tags: [admin-settings]
    operationId: issueInitialPassword
    x-module: Auth
    summary: 初期パスワードを発行する
    description: メールのない従業員向け。応答で一度だけ返す。初回ログインで変更させる（UC-AU-10）。
    x-required-roles: [tenantAdmin]
    security:
      - bearerAuth: [admin]
