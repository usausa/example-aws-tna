employeeImports:
  post:
    tags: [admin-settings]
    operationId: previewEmployeeImport
    x-module: AdminSettings
    summary: 従業員の CSV を検証する
    description: CSV（CSV の形式 §3.1）を検証し、新規・更新・誤りを返す（UC-SE-04）。この時点では反映しない。誤りがなければ `importId` を返す（1時間有効）。
    x-required-roles: [tenantAdmin]
    security:
      - bearerAuth: [admin]
    parameters:
      - name: encoding
        in: query
        description: 文字コード（既定 `utf8`）。
        schema:
          $ref: ../components/schemas/common.yaml#/CsvImportEncoding
    requestBody:
      required: true
      content:
        text/csv:
          schema:
            type: string
            format: binary
            description: CSV のバイト列。文字コードは `encoding` で示す。上限は 4MB（4,194,304 バイト。Base64 で受け取ると関数の上限 6MB に近づくため）。
    responses:
      "200":
        description: 検証の結果。
        content:
          application/json:
            schema:
              $ref: ../components/schemas/admin.yaml#/ImportResult
      "403":
        $ref: ../components/responses.yaml#/Forbidden
      "413":
        description: 大きすぎる（PAYLOAD_TOO_LARGE。4MB 超、または10,000行超）。
        content:
          application/problem+json:
            schema:
              $ref: ../components/schemas/common.yaml#/Problem
employeeImportApply:
  post:
    tags: [admin-settings]
    operationId: applyEmployeeImport
    x-module: AdminSettings
    summary: 従業員の CSV を反映する
    description: |
      検証済みの取込を非同期のジョブで反映する。新規の従業員に招待メールを送るかを選べる（UC-SE-04）。結果は、ジョブ（getJob）の
      `result.summary` に、新規・更新・失敗の件数と、失敗した行（行番号と理由）を返す。結果のファイルは作らない。
    x-required-roles: [tenantAdmin]
    security:
      - bearerAuth: [admin]
    parameters:
