# 管理: 設定（/api/v1/admin）。bearerAuth の admin スコープ。
# 更新は `x-required-roles: [tenantAdmin]` の操作だけテナント管理者に限る（勤怠管理者は閲覧のみ）。
# PATCH は JSON Merge Patch（application/merge-patch+json）。画面は編集したリソース全体を送ってよい（required は作成時の条件）。
employees:
  get:
    tags: [admin-settings]
    operationId: listEmployees
    x-module: AdminSettings
    summary: 従業員の一覧を取得する
    description: 管理範囲の従業員を返す（テナント管理者はすべて）（SE01）。
    security:
      - bearerAuth: [admin]
    parameters:
      - $ref: ../components/parameters.yaml#/DepartmentIdQuery
      - $ref: ../components/parameters.yaml#/IncludeDescendants
      - name: status
        in: query
        schema:
          $ref: ../components/schemas/organization.yaml#/EmployeeStatus
      - name: q
        in: query
        description: 社員番号・氏名・かなの部分一致（かなは、ひらがなと半角のカナも全角カタカナにそろえて比べる）。
        schema:
          type: string
      - $ref: ../components/parameters.yaml#/Limit
      - $ref: ../components/parameters.yaml#/NextToken
    responses:
      "200":
        description: 従業員の一覧（管理範囲内）。
        content:
          application/json:
            schema:
              $ref: ../components/schemas/organization.yaml#/EmployeeList
      "403":
        $ref: ../components/responses.yaml#/Forbidden
  post:
    tags: [admin-settings]
    operationId: createEmployee
    x-module: AdminSettings
    summary: 従業員を登録する
    description: 従業員を登録し、メールアドレスがあれば招待メールを送る（UC-SE-01）。
    x-required-roles: [tenantAdmin]
    security:
      - bearerAuth: [admin]
    parameters:
      - $ref: ../components/parameters.yaml#/IdempotencyKey
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: ../components/schemas/organization.yaml#/EmployeeCreate
    responses:
      "201":
        description: 登録した。初期 PIN を発行した場合は、この応答でだけ返す。
        headers:
          ETag:
            $ref: ../components/headers.yaml#/ETag
        content:
          application/json:
            schema:
              $ref: ../components/schemas/organization.yaml#/EmployeeCreated
      "400":
        $ref: ../components/responses.yaml#/BadRequest
      "403":
        $ref: ../components/responses.yaml#/Forbidden
      "409":
        description: 社員番号・メールアドレスの重複（EMPLOYEE_CODE_DUPLICATED、EMAIL_DUPLICATED）。
        content:
          application/problem+json:
            schema:
              $ref: ../components/schemas/common.yaml#/Problem
employee:
  get:
    tags: [admin-settings]
    operationId: getEmployee
    x-module: AdminSettings
    summary: 従業員を取得する
    description: 基本情報、現在の条件、アカウント、ロールを返す（SE01）。
    security:
      - bearerAuth: [admin]
    parameters:
      - $ref: ../components/parameters.yaml#/EmployeeId
    responses:
      "200":
        description: 従業員。
        headers:
          ETag:
            $ref: ../components/headers.yaml#/ETag
        content:
          application/json:
            schema:
              $ref: ../components/schemas/organization.yaml#/Employee
      "403":
        $ref: ../components/responses.yaml#/Forbidden
      "404":
        $ref: ../components/responses.yaml#/NotFound
  patch:
    tags: [admin-settings]
    operationId: updateEmployee
    x-module: AdminSettings
    summary: 従業員の基本情報を変更する
    description: |
      社員番号・氏名・かな・メールアドレス・入社日を変える。所属などの条件は assignments で変える（UC-SE-01）。
      入社日は、旧い入社日と新しい入社日の間に勤怠・休暇・申請の記録がなく、その間が締め済みの期間にかからず、有給をまだ付与して
      いない場合だけ変えられる（HIRE_DATE_LOCKED。UC-SE-16）。最初の条件の適用日も入社日に合わせて動かす。
    x-required-roles: [tenantAdmin]
    security:
      - bearerAuth: [admin]
    parameters:
      - $ref: ../components/parameters.yaml#/EmployeeId
      - $ref: ../components/parameters.yaml#/IfMatch
    requestBody:
      required: true
      content:
        application/merge-patch+json:
          schema:
            $ref: ../components/schemas/organization.yaml#/EmployeePatch
    responses:
      "200":
        description: 変更後の従業員。
        headers:
          ETag:
            $ref: ../components/headers.yaml#/ETag
        content:
          application/json:
            schema:
              $ref: ../components/schemas/organization.yaml#/Employee
      "400":
        $ref: ../components/responses.yaml#/BadRequest
      "403":
        $ref: ../components/responses.yaml#/Forbidden
      "409":
        $ref: ../components/responses.yaml#/Conflict
      "412":
        $ref: ../components/responses.yaml#/PreconditionFailed
  delete:
    tags: [admin-settings]
    operationId: deleteEmployee
    x-module: Auth
    summary: 従業員を削除する
    description: |
      誤って登録した従業員を消す（UC-SE-15）。勤怠・休暇・申請の記録がなく、ログインしたことがなく、ロールを持たず、部署の
      所属長や承認ルートの承認者に指定されていない従業員だけ消せる（EMPLOYEE_HAS_RECORDS）。従業員、条件の履歴、社員番号と
      メールアドレスの一意性の項目、アカウントを1つのトランザクションで消し、監査ログに残す。アカウントを消すため、アカウントの
      操作と同じく認証の処理が受け持つ。
    x-required-roles: [tenantAdmin]
    security:
      - bearerAuth: [admin]
    parameters:
      - $ref: ../components/parameters.yaml#/EmployeeId
      - $ref: ../components/parameters.yaml#/IfMatch
    responses:
      "204":
        description: 削除した。
      "403":
        $ref: ../components/responses.yaml#/Forbidden
      "404":
        $ref: ../components/responses.yaml#/NotFound
      "409":
        description: 記録や指定があるため削除できない（EMPLOYEE_HAS_RECORDS）。
        content:
          application/problem+json:
            schema:
              $ref: ../components/schemas/common.yaml#/Problem
      "412":
        $ref: ../components/responses.yaml#/PreconditionFailed
employeeAssignments:
  get:
    tags: [admin-settings]
    operationId: listEmployeeAssignments
    x-module: AdminSettings
    summary: 従業員の条件の履歴を取得する
    description: 適用日ごとの条件（所属、雇用区分、就業ルールなど）を返す（UC-SE-02）。
    security:
      - bearerAuth: [admin]
    parameters:
      - $ref: ../components/parameters.yaml#/EmployeeId
    responses:
      "200":
        description: 条件の履歴（古い順）。
        content:
          application/json:
            schema:
              $ref: ../components/schemas/organization.yaml#/EmployeeAssignmentList
      "403":
        $ref: ../components/responses.yaml#/Forbidden
      "404":
        $ref: ../components/responses.yaml#/NotFound
  post:
    tags: [admin-settings]
    operationId: createEmployeeAssignment
    x-module: AdminSettings
    summary: 従業員の条件を変更する
    description: 適用日からの新しい条件を登録し、適用日以降の締めていない勤務日を再計算する（UC-SE-02）。
    x-required-roles: [tenantAdmin]
    security:
      - bearerAuth: [admin]
    parameters:
      - $ref: ../components/parameters.yaml#/EmployeeId
      - $ref: ../components/parameters.yaml#/IfMatch
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: ../components/schemas/organization.yaml#/EmployeeAssignment
    responses:
      "201":
        description: 登録した条件。
        headers:
          ETag:
            $ref: ../components/headers.yaml#/ETag
        content:
          application/json:
            schema:
              $ref: ../components/schemas/organization.yaml#/EmployeeAssignment
      "400":
        $ref: ../components/responses.yaml#/BadRequest
      "403":
        $ref: ../components/responses.yaml#/Forbidden
      "409":
        description: 適用日が締め済みの期間にかかる（PERIOD_CLOSED）。
        content:
          application/problem+json:
            schema:
              $ref: ../components/schemas/common.yaml#/Problem
      "412":
        $ref: ../components/responses.yaml#/PreconditionFailed
employeeTerminate:
  post:
    tags: [admin-settings]
    operationId: terminateEmployee
    x-module: AdminSettings
    summary: 従業員を退職させる
    description: |
      退職日を登録する。退職日の翌日から打刻と申請を受け付けず、退職日の終わりにアカウントを無効にする（UC-SE-03）。登録した
      退職日は、退職の処理（退職日の翌日 0:01。UC-BA-11）の前なら、同じ操作で変えられる。新しい退職日と前の退職日は、
      入社日以降で、締めていない期間の日であること（TERMINATION_LOCKED）。退職を処理した後は変えられない（TERMINATION_LOCKED。
      取り消して（reinstateEmployee）から登録し直す）。
    x-required-roles: [tenantAdmin]
    security:
      - bearerAuth: [admin]
    parameters:
      - $ref: ../components/parameters.yaml#/EmployeeId
      - $ref: ../components/parameters.yaml#/IfMatch
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: ../components/schemas/organization.yaml#/TerminateRequest
    responses:
      "200":
        description: 退職を登録した従業員。
        content:
          application/json:
            schema:
              $ref: ../components/schemas/organization.yaml#/Employee
      "403":
        $ref: ../components/responses.yaml#/Forbidden
      "409":
        $ref: ../components/responses.yaml#/Conflict
      "412":
        $ref: ../components/responses.yaml#/PreconditionFailed
employeeReinstate:
  post:
    tags: [admin-settings]
    operationId: reinstateEmployee
    x-module: Auth
    summary: 退職を取り消す
    description: |
      登録した退職日を取り消す（UC-SE-03）。退職の処理（退職日の翌日 0:01。UC-BA-11）の後も、退職日が締めていない期間に
      あるうちは取り消せる（TERMINATION_LOCKED）。処理の後なら、状態を在籍（休業の期間なら休業）に戻し、名簿と記録の保存期間を
      戻し、社員番号とメールアドレス（ログインID）の一意性の項目を付け直し（ほかの従業員が使っていれば EMPLOYEE_CODE_DUPLICATED、
      EMAIL_DUPLICATED）、退職の処理で無効にしたアカウントを有効に戻す。取り下げた休暇申請は戻らない。退職を処理した後に
      退職日を変えるときは、取り消してから登録し直す。アカウントを戻すため、アカウントの操作と同じく認証の処理が受け持つ。
    x-required-roles: [tenantAdmin]
    security:
      - bearerAuth: [admin]
    parameters:
      - $ref: ../components/parameters.yaml#/EmployeeId
      - $ref: ../components/parameters.yaml#/IfMatch
    responses:
      "200":
        description: 退職を取り消した従業員。
        content:
          application/json:
            schema:
              $ref: ../components/schemas/organization.yaml#/Employee
      "403":
        $ref: ../components/responses.yaml#/Forbidden
      "404":
        $ref: ../components/responses.yaml#/NotFound
      "409":
        $ref: ../components/responses.yaml#/Conflict
      "412":
        $ref: ../components/responses.yaml#/PreconditionFailed
employeeRoles:
  put:
    tags: [admin-settings]
    operationId: updateEmployeeRoles
    x-module: AdminSettings
    summary: ロールと管理範囲を設定する
