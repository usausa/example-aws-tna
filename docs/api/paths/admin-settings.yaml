        schema:
          $ref: ../components/schemas/common.yaml#/Ulid
      - $ref: ../components/parameters.yaml#/IdempotencyKey
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: ../components/schemas/organization.yaml#/EmployeeImportApplyRequest
    responses:
      "202":
        description: 受け付けた。
        headers:
