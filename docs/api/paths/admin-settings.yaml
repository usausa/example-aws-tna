    tags: [admin-settings]
    operationId: resetMfa
    x-module: Auth
    summary: TOTP を解除する
    description: 紛失時に使う。自分自身には使えない（UC-AU-10）。
    x-required-roles: [tenantAdmin]
    security:
      - bearerAuth: [admin]
    parameters:
      - $ref: ../components/parameters.yaml#/EmployeeId
    responses:
      "204":
        description: 解除した。
      "403":
        $ref: ../components/responses.yaml#/Forbidden
accountPinReset:
  post:
    tags: [admin-settings]
    operationId: resetPin
    x-module: Auth
    summary: 共有端末用の PIN をリセットする
    description: 初期 PIN を発行し、応答で一度だけ返す。初回の打刻で本人が変える。勤怠管理者も範囲内なら行える（UC-AU-10）。
    security:
      - bearerAuth: [admin]
    parameters:
