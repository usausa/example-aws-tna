      無効化は、退職していない従業員だけ戻せる（ACCOUNT_STATE_INVALID）。
    x-required-roles: [tenantAdmin]
    security:
      - bearerAuth: [admin]
    parameters:
      - $ref: ../components/parameters.yaml#/EmployeeId
    responses:
      "204":
        description: 解除した。
      "403":
        $ref: ../components/responses.yaml#/Forbidden
accountMfaReset:
