# 共通のエラー応答（RFC 9457 Problem Details）
BadRequest:
  description: 入力の誤り（VALIDATION_FAILED）。`errors` に項目ごとの誤りを入れる。
  content:
    application/problem+json:
      schema:
        $ref: schemas/common.yaml#/Problem
Unauthorized:
  description: 認証されていない、またはアクセストークンの期限切れ（UNAUTHENTICATED）。画面はトークンを更新してから1回だけ再送する。
  content:
    application/problem+json:
      schema:
        $ref: schemas/common.yaml#/Problem
Forbidden:
  description: 権限がない（FORBIDDEN）。管理機能の再認証が必要（REAUTH_REQUIRED）、テナントの停止（TENANT_SUSPENDED）も 403 で返す。
  content:
    application/problem+json:
      schema:
        $ref: schemas/common.yaml#/Problem
NotFound:
  description: 対象が見つからない（NOT_FOUND）。権限の範囲外のものも 404 として返す。
  content:
    application/problem+json:
      schema:
        $ref: schemas/common.yaml#/Problem
Conflict:
  description: 状態の競合（PUNCH_SEQUENCE_INVALID、PERIOD_CLOSED、REQUEST_STATE_INVALID、マスタのコードの重複 CODE_DUPLICATED、冪等キーの処理中 IDEMPOTENCY_KEY_IN_PROGRESS など）。
  content:
    application/problem+json:
      schema:
        $ref: schemas/common.yaml#/Problem
PreconditionFailed:
  description: If-Match が一致しない（VERSION_CONFLICT）。最新の状態を取得し直す。
  content:
    application/problem+json:
      schema:
        $ref: schemas/common.yaml#/Problem
UnprocessableEntity:
  description: 業務規則の違反（LEAVE_BALANCE_INSUFFICIENT、IDEMPOTENCY_KEY_REUSED など）。
  content:
    application/problem+json:
      schema:
        $ref: schemas/common.yaml#/Problem
PreconditionRequired:
  description: If-Match がない（PRECONDITION_REQUIRED）。
  content:
    application/problem+json:
      schema:
        $ref: schemas/common.yaml#/Problem
TooManyRequests:
  description: レート制限（RATE_LIMITED）。Retry-After の秒数だけ待って、同じ冪等キーで再送する。
  headers:
    Retry-After:
      $ref: headers.yaml#/RetryAfter
  content:
    application/problem+json:
      schema:
        $ref: schemas/common.yaml#/Problem
ServiceUnavailable:
  description: 一時的に利用できない（SERVICE_UNAVAILABLE）。Retry-After の秒数だけ待って、同じ冪等キーで再送する。
  headers:
    Retry-After:
      $ref: headers.yaml#/RetryAfter
  content:
    application/problem+json:
      schema:
        $ref: schemas/common.yaml#/Problem
